services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dineflow
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: .
    profiles: ["app"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/dineflow
      JWT_SECRET: change-me-in-production-please-32chars
    ports: ["3000:3000"]
    depends_on: [db]
volumes:
  pgdata:
